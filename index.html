<!doctype html>
<!--
  index.html — the single HTML page Vite serves.
  React mounts the whole app into the <div id="root"> below.
  Everything else (UI, routing, state) is built in JavaScript under /src.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <title>AI Learning Companion</title>
  </head>
  <body>
    <!-- React renders into this element (see src/main.jsx). -->
    <div id="root"></div>
    <!-- type="module" lets the browser load our ES-module entry point. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
