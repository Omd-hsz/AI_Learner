<!doctype html>
<!--
  index.html — the single HTML page Vite serves.
  React mounts the whole app into the <div id="root"> below.
  Everything else (UI, routing, state) is built in JavaScript under /src.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4ede3" />
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Critical light theme — loads before CSS so a stale PWA cache cannot flash dark -->
    <style>
      html { color-scheme: light only; background: #f4ede3; }
      body { margin: 0; background: #f4ede3; color: #4a4238; }
      #root { min-height: 100vh; background: #f4ede3; }
    </style>
    <title>AI Learning Companion</title>
  </head>
  <body>
    <!-- React renders into this element (see src/main.jsx). -->
    <div id="root"></div>
    <!-- type="module" lets the browser load our ES-module entry point. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
