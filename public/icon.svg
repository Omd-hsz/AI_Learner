<?xml version="1.0" encoding="UTF-8"?>
<!-- App icon. SVG so it scales to any size the OS asks for (192, 512, etc.). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square (safe-zone friendly for maskable icons). -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- A simple "spark / lesson" glyph. -->
  <g fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 120 L256 392" />
    <path d="M120 256 L392 256" />
    <path d="M168 168 L344 344" />
    <path d="M344 168 L168 344" />
  </g>
  <circle cx="256" cy="256" r="58" fill="#ffffff"/>
  <circle cx="256" cy="256" r="30" fill="#6366f1"/>
</svg>
